data:
  path: data/processed/cleaned_dataset.csv
  target_column: 'toxic'
  text_column: 'comment'
  test_size: 0.2
  max_length: 256   # max tokens; truncation cap shared by training and inference


model:
  model_name: 'cointegrated/rubert-tiny2'
  num_classes: 2


mymodelv2_params:
  embedding_dim: 300
  num_heads: 4
  num_layers: 2
  num_classes: 2  


training:
  seed: 42
  batch_size: 32
  num_epochs: 3
  learning_rate: 2.0e-5


# Directories where trained models/tokenizers are saved and loaded from.
# Used by both the training scripts and src/predict.py so they never drift apart.
paths:
  bert_dir: models/bert_sequence_classification
  mymodelv2_dir: models/custom_modelv2