data:
  path: data/processed/labeled.csv
  target_column: 'toxic'
  text_column: 'comment'
  test_size: 0.2


logistic_regression:
  C: 1.0
  max_iter: 1000
  random_state: 42
  class_weight: 'balanced'

tfidf:
  max_features: 5000
  stop_words: 'russian'

model:
  model_name: 'cointegrated/rubert-tiny2'
  num_classes: 2

my_model_params:
  in_size: 768
  hidden_size: 256
  out_size: 2

mymodelv2_params:
  embedding_dim: 300
  num_heads: 4
  num_layers: 2
  num_classes: 2
  


training:
  seed: 42
  batch_size: 32
  num_epochs: 3
  learning_rate: 2e-5